<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Spend Analytics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; }

    body {
      margin: 0;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 96%;
      max-width: 1200px;
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.25);
    }

    h1 { color: #1a237e; margin: 0; font-size: 22px; }
    h3 { margin-top: 0; }

    .badge {
      background: #e3f2fd;
      color: #1565c0;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .search-box { display: flex; gap: 10px; margin: 14px 0; }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 14px;
    }

    button, select {
      background: linear-gradient(135deg, #3949ab, #1e88e5);
      border: none;
      padding: 10px 16px;
      color: #fff;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    .card {
      background: #f9fafc;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #e0e0e0;
    }

    .confidence {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 8px;
    }

    .insight {
      background: #e3f2fd;
      border-left: 4px solid #1e88e5;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 13px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px; border-bottom: 1px solid #ddd; }
    th { background: #e3f2fd; }

    .chart-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .chart-wrapper {
      width: 340px;
      height: 240px;
    }

    canvas { width: 100% !important; height: 100% !important; }

    .export-box {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 8px;
    }

    .prompt-box {
      display: none;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .prompt-box button {
      background: #e3f2fd;
      color: #0d47a1;
    }
  </style>
</head>

<body>

<div class="container">

  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h1>Spend Analytics</h1>
    <div class="badge">BigQuery Native</div>
  </div>

  <div class="search-box">
    <input id="question" placeholder="Ask: Buying channel wise spend" />
    <button onclick="ask()">Ask</button>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h3>✨ AI Suggested Prompts</h3>
      <button onclick="togglePrompts()">Toggle</button>
    </div>
    <div id="promptBox" class="prompt-box">
      <button onclick="runPrompt('Buying channel wise spend')">Buying channel wise spend</button>
      <button onclick="runPrompt('Top 5 vendors by total spend')">Top 5 vendors by spend</button>
      <button onclick="runPrompt('Monthly spend trend for last 12 months')">Monthly spend trend</button>
      <button onclick="runPrompt('Category wise procurement spend')">Category wise spend</button>
      <button onclick="runPrompt('Country wise supplier spend')">Country wise supplier spend</button>
    </div>
  </div>

  <div id="confidence"></div>

  <div class="card">
    <h3>Insights</h3>
    <div id="insights">Run a query to see insights</div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:flex-end;">
      <select onchange="sqlCard.style.display=this.value==='show'?'block':'none'">
        <option value="hide">Hide SQL</option>
        <option value="show">Show SQL</option>
      </select>
    </div>
    <div id="sqlCard" style="display:none;">
      <pre id="sql">--</pre>
    </div>
  </div>

  <div class="card">
    <h3>Results</h3>
    <div id="results">No results yet</div>
  </div>

  <div class="card" id="chartCard" style="display:none;">
    <div class="export-box">
      <select id="exportType">
        <option value="bar">Export Bar Chart</option>
        <option value="pie">Export Pie Chart</option>
        <option value="donut">Export Donut Chart</option>
      </select>
      <button onclick="exportSelectedChart()">Export</button>
    </div>

    <h3>Visualization</h3>

    <div class="chart-section">
      <div class="chart-wrapper"><canvas id="barChart"></canvas></div>
      <div class="chart-wrapper"><canvas id="pieChart"></canvas></div>
      <div class="chart-wrapper"><canvas id="donutChart"></canvas></div>
    </div>
  </div>

</div>

<script>
const API_URL = "https://sqlbotmainup-277069041958.us-central1.run.app";
let barChart, pieChart, donutChart;

function togglePrompts() {
  promptBox.style.display = promptBox.style.display === "flex" ? "none" : "flex";
}

function runPrompt(text) {
  question.value = text;
  ask();
}

async function ask() {
  if (!question.value) return;

  chartCard.style.display = "none";
  insights.innerHTML = "Analyzing...";
  results.innerHTML = "Loading...";

  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question: question.value })
  });

  const data = await res.json();

  sql.innerText = data.sql || "--";
  confidence.innerHTML = `<span class="confidence">Confidence ${(data.confidence_score * 100).toFixed(0)}%</span>`;

  renderTable(data.rows);
  renderInsights(data.rows);
  renderCharts(data.rows);
}

function renderInsights(rows) {
  if (!rows || !rows.length) {
    insights.innerHTML = "No insights available";
    return;
  }

  const dim = Object.keys(rows[0])[0];
  const metric = Object.keys(rows[0])[1];

  const clean = rows.map(r => ({ dim: r[dim], value: Number(r[metric]) || 0 }));
  const sorted = [...clean].sort((a,b)=>b.value-a.value);
  const total = sorted.reduce((s,r)=>s+r.value,0);

  const pct = v => ((v / total) * 100).toFixed(1);

  insights.innerHTML = `
    <div class="insight">🔝 ${sorted[0].dim}: ${pct(sorted[0].value)}%</div>
    <div class="insight">📊 Top 3 ${dim}s: ${pct(sorted.slice(0,3).reduce((s,r)=>s+r.value,0))}%</div>
    <div class="insight">⚠️ Concentration risk if Top 3 &gt; 70%</div>
  `;
}

function renderTable(rows) {
  if (!rows || !rows.length) {
    results.innerHTML = "No data";
    return;
  }

  const cols = Object.keys(rows[0]);
  let html = "<table><tr>";
  cols.forEach(c => html += `<th>${c}</th>`);
  html += "</tr>";

  rows.forEach(r => {
    html += "<tr>";
    cols.forEach(c => html += `<td>${r[c]}</td>`);
    html += "</tr>";
  });

  results.innerHTML = html + "</table>";
}

function renderCharts(rows) {
  if (!rows || !rows.length) return;

  chartCard.style.display = "block";

  const keys = Object.keys(rows[0]);
  const labels = rows.map(r => r[keys[0]]);
  const values = rows.map(r => Number(r[keys[1]]) || 0);

  barChart && barChart.destroy();
  pieChart && pieChart.destroy();
  donutChart && donutChart.destroy();

  barChart = new Chart(document.getElementById("barChart"), {
    type: "bar",
    data: { labels, datasets: [{ data: values, backgroundColor: "#42a5f5" }] },
    options: { responsive: true, maintainAspectRatio: false, plugins:{legend:{display:false}} }
  });

  pieChart = new Chart(document.getElementById("pieChart"), {
    type: "pie",
    data: { labels, datasets: [{ data: values }] },
    options: { responsive: true, maintainAspectRatio: false }
  });

  donutChart = new Chart(document.getElementById("donutChart"), {
    type: "doughnut",
    data: { labels, datasets: [{ data: values }] },
    options: { responsive: true, maintainAspectRatio: false }
  });
}

function exportSelectedChart() {
  const type = exportType.value;
  const chart = type === "bar" ? barChart : type === "pie" ? pieChart : donutChart;
  if (!chart) return;

  const link = document.createElement("a");
  link.href = chart.toBase64Image();
  link.download = `spend_${type}_chart.png`;
  link.click();
}
</script>

</body>
</html>
